# Przenosi nowe rolki z Facebooka do R2. Opis: docs/landing/17-rolki.md
#
# Akcja, a nie Worker, bo film z Facebooka bywa w AV1 i trzeba go przeliczyć
# ffmpegiem. ffmpeg instaluje sam skrypt, tylko gdy trafi na nową rolkę.
# Bez sekretów przebieg kończy się błędem, ale niczego nie zmienia.

name: Rolki

on:
  # Zapas. Główny wyzwalacz to cron Workera busikm-media co 15 minut
  # (workflow_dispatch), bo ten harmonogram GitHub odpala rzadko i późno.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

# Dwa przebiegi naraz zapisałyby katalog jeden na drugim.
concurrency:
  group: rolki

permissions:
  contents: read

jobs:
  synchronizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Synchronizacja
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node media-worker/rolki/synchronizuj.mjs
